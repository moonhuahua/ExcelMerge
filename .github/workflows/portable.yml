name: Build ExcelMerge Portable
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - uses: NuGet/setup-nuget@v2
      - name: Restore dependencies
        shell: pwsh
        run: nuget restore ExcelMerge.sln -ConfigFile .nuget/NuGet.Config -NonInteractive
      - name: Switch settings to portable folder
        shell: pwsh
        run: |
          $p='ExcelMerge.GUI/Settings/ApplicationSetting.cs'
          $s=[IO.File]::ReadAllText($p)
          $a='Path.Combine(Environment.GetFolderPath(Environment.SpecialFolder.ApplicationData),'
          if(-not $s.Contains($a)){throw 'Cannot find original settings location'}
          $s=$s.Replace($a,'Path.Combine(AppDomain.CurrentDomain.BaseDirectory,')
          $s=$s.Replace('"ExcelMerge", "ExcelMerge.yml"','"Data", "ExcelMerge.yml"')
          [IO.File]::WriteAllText($p,$s)
      - name: Build GUI Release
        shell: pwsh
        run: msbuild ExcelMerge.GUI/ExcelMerge.GUI.csproj /t:Build /p:Configuration=Release /p:Platform=AnyCPU /p:TargetFrameworkVersion=v4.8 /m /v:minimal
      - name: Zip portable folder
        shell: pwsh
        run: |
          $dest='dist/ExcelMerge'
          New-Item -ItemType Directory -Path "$dest/Data" -Force | Out-Null
          Copy-Item 'ExcelMerge.GUI/bin/Release/*' $dest -Recurse -Force
          if(-not (Test-Path "$dest/ExcelMerge.GUI.exe")){throw 'Executable missing'}
          Copy-Item README.md "$dest/README.md"
          @'
          ExcelMerge Portable - Start ExcelMerge.GUI.exe.
          No installation required. Settings saved to Data/ExcelMerge.yml.
          Windows 11 includes the required .NET Framework 4.8.
          Keep all DLLs and subfolders together.
          MIT License: https://github.com/moonhuahua/ExcelMerge
          '@ | Set-Content "$dest/README-PORTABLE.txt" -Encoding utf8
          Compress-Archive -Path $dest -DestinationPath ExcelMerge-Portable-Windows.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: ExcelMerge-Portable-Windows
          path: ExcelMerge-Portable-Windows.zip
          if-no-files-found: error
